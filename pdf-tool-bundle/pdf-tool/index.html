<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Tool: merge, edit and compress PDFs in your browser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%84%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="busybar"></div>
<header>
  <h1>PDF Tool</h1>
  <button id="add">Add PDF</button>
  <select id="quality" title="Compression. Medium, High and Smallest turn pages into images, so text is no longer selectable.">
    <option value="Original">Original quality</option>
    <option value="High">High quality</option>
    <option value="Medium">Medium quality</option>
    <option value="Smallest">Smallest (aims for 70% smaller)</option>
  </select>
  <button id="download" class="primary" disabled>Download</button>
  <span id="info"></span>
</header>
<input type="file" id="picker" accept="application/pdf,.pdf" multiple hidden>
<main>
  <div id="empty">Drop PDF files here or click “Add PDF”<small>Files never leave your device.</small></div>
  <div id="grid"></div>
</main>
<footer>🔒 Your files never leave your device. Everything runs in this browser.</footer>
<div id="editor" hidden>
  <div id="etools">
    <button id="eimg">+ Picture</button><button id="etxt">+ Text</button>
    <span id="eimgctl" hidden><label>Opacity <input id="eop" type="range" min="0.1" max="1" step="0.05"></label></span>
    <span id="etxtctl" hidden><label>Size <input id="esz" type="number" min="4" max="300" style="width:64px"></label> <label>Color <input id="ecol" type="color"></label></span>
    <button id="edel" hidden>Delete item</button><span id="emsg"></span>
    <button id="edone" class="primary">Done</button>
  </div>
  <div id="escroll"><div id="stage"><canvas id="ecanvas"></canvas><div id="layer"></div></div></div>
  <input type="file" id="epick" accept="image/png,image/jpeg" hidden>
</div>
<div id="msg" role="status"></div>
<script src="vendor/pdf-lib.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
